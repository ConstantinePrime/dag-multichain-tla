\* Resolved protocol on dag5: sibling transfers confirmed by every parent of a
\* chain with two parents or more, refund on refusal; nocompromise or any one chain compromised (c0 = 0 means none).
\* Expected: holds
SPECIFICATION Spec
CONSTANTS
    SCENARIO = "dag5"
    UP = "lock"
    OBSERVERS = TRUE
    VALIDATE = "multi_parent"
    UNWIND = "amended"
    ALLOW_REJECT = TRUE
    COMPROMISE = {0, 1, 2, 3, 4, 5}
    MaxTx = 2
    MaxForge = 1
INVARIANTS
    TypeOK
    Conservation
    Backed
    SettlesSafe
    ProvenanceContained
    GroupContained
    CirculationContained
PROPERTIES
    Terminates
CHECK_DEADLOCK FALSE
